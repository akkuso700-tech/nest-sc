<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const savedTheme = window.localStorage.getItem('Nest Social')
        const theme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <script>
      (() => {
        const gtagId = 'G-K71B9ENCSS'
        const bootstrapGtag = () => {
          if (window.__nestGtagLoaded) return
          window.__nestGtagLoaded = true
          window.dataLayer = window.dataLayer || []
          window.gtag = function gtag() {
            window.dataLayer.push(arguments)
          }
          window.gtag('js', new Date())
          window.gtag('config', gtagId)

          const script = document.createElement('script')
          script.async = true
          script.src = `https://www.googletagmanager.com/gtag/js?id=${gtagId}`
          document.head.appendChild(script)
        }

        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(bootstrapGtag, { timeout: 3000 })
        } else {
          window.setTimeout(bootstrapGtag, 1500)
        }
      })()
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f1f7ff;
        z-index: 99999;
      }
      html.dark #app-splash {
        background-color: #020617;
      }
      .splash-logo {
        width: 68px;
        height: 68px;
        animation: splash-pulse 1.6s ease-in-out infinite;
        filter: drop-shadow(0 10px 25px rgba(37, 99, 235, 0.35));
      }
      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
    </style>
    <title>Nest Social</title>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <svg class="splash-logo" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splashBg" x1="32" y1="24" x2="224" y2="232" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#60A5FA"/>
              <stop offset="50%" stop-color="#2563EB"/>
              <stop offset="100%" stop-color="#1D4ED8"/>
            </linearGradient>
            <linearGradient id="splashShape" x1="78" y1="68" x2="178" y2="188" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="100%" stop-color="#DBEAFE"/>
            </linearGradient>
          </defs>
          <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#splashBg)"/>
          <circle cx="128" cy="128" r="54" stroke="rgba(255,255,255,0.22)" stroke-width="10"/>
          <path d="M82 174V86C82 79.373 87.373 74 94 74C98.293 74 102.24 76.284 104.39 80L128 121L151.61 80C153.76 76.284 157.707 74 162 74C168.627 74 174 79.373 174 86V174H153V120L136.66 148.58C132.89 155.17 123.11 155.17 119.34 148.58L103 120V174H82Z" fill="url(#splashShape)"/>
          <circle cx="70" cy="94" r="8" fill="#BFDBFE" fill-opacity="0.9"/>
          <circle cx="188" cy="162" r="6" fill="#93C5FD" fill-opacity="0.85"/>
          <circle cx="194" cy="92" r="5" fill="#DBEAFE" fill-opacity="0.85"/>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
