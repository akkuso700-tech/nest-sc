name: Deployment smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  live-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deep links and published chunks
        run: node frontend/scripts/check-deployment.mjs
